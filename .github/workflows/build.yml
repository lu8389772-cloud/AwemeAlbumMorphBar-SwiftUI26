name: Build AwemeLiquidBar Xcode 27

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode 27 and iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          [[ "$SDK_VERSION" == 27.* ]]

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/.theos"

      - name: Preflight Swift native tab controller
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/preflight.sh

      - name: Preprocess Logos source
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          set -euo pipefail
          perl "$THEOS/bin/logos.pl" Tweak.x > /tmp/AwemeLiquidBar-Tweak.x.m
          test -s /tmp/AwemeLiquidBar-Tweak.x.m

      - name: Build rootless package
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          set -euo pipefail
          make clean
          make package -j1
          find packages -maxdepth 1 -type f -name '*.deb' -print
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AwemeLiquidBar-1.0.43d-Xcode27-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
